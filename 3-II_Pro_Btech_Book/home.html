<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <title>BTB Home</title>
  <!-- Bootstrap 5.3 -->

<!-- Premium Theme -->
  <link rel="stylesheet" href="premium.css">

  <link rel="shortcut icon" href="library2.jpeg" type="image/x-icon">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
  <section class="Book">
    <!-- Header / Navbar -->
    <header>
      <section class="nave">
        <section class="binfo">B-Tech Book</section>
        <section id="naveg">
          <nav class="aa">
            <a href="books.html" class="s">Book</a>
            <a href="btb_bot.html" class="s">BTB-Bot</a>
            
          </nav>
        </section>
      </section>
    </header>

    <!-- Main Content -->
    <main>
      <section class="side">
        <!-- Left Sidebar -->
        <!-- Sidebar -->
<aside class="info">
  <img src="pink-user-icon-rounded-profile-icon-vector.jpg" alt="User Icon" class="img-fluid rounded-circle mb-3">
  <a id="info" href="#" class="a">User</a>
  <a href="btb_bot.html" class="a">BTB-BOT</a>
  <a href="help.html" class="a">Help!</a> <!-- Changed this line -->
  <a href="log_out.html" class="a" id="logoutLink">Log-out</a>
</aside>

        <!-- Center Department Content -->
        <section class="dive" id="content-area">
          <article style="background-image: url(csebg.jpg);" onclick="window.location.href='cse.html'">
            <img src="OIP__1_-removebg-preview.png" alt=""><br>CSE
          </article>

          <article style="background-image: url(eeebg.jpg);" onclick="window.location.href='ece.html'">
            <img src="OIP__1_-removebg-preview.png" alt=""><br>ECE
          </article>

          <article style="background-image: url(ITbg.jpg);" onclick="window.location.href='it.html'">
            <img src="OIP__1_-removebg-preview.png" alt=""><br>IT
          </article>

          <article style="background-image: url(network-background.jpg);" onclick="window.location.href='EEE.html'">
            <img src="OIP__1_-removebg-preview.png" alt=""><br>EEE
          </article>
        </section>

        <!-- Right Sidebar (optional) -->
        <aside class="extra"></aside>
      </section>
    </main>
  </section>

  <!-- Firebase and JS -->
  <script type="module">
    // Import Firebase SDK
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js";

    // Firebase configuration
    const firebaseConfig = {
      apiKey: "AIzaSyCPvhb-YcDLoj40-ID4n98y3p7a9DcYwFI",
      authDomain: "b-tech-book.firebaseapp.com",
      projectId: "b-tech-book",
      storageBucket: "b-tech-book.firebasestorage.app",
      messagingSenderId: "298368878481",
      appId: "1:298368878481:web:ab5607279b7bba1f8cfc30"
    };

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    // Display logged-in user email or "User"
    const userLink = document.getElementById("info");
    onAuthStateChanged(auth, (user) => {
      if (user) {
        userLink.textContent = user.email;
      } else {
        userLink.textContent = "User";
      }
    });

    // Logout functionality
    document.getElementById("logoutLink").addEventListener("click", (e) => {
      e.preventDefault();
      signOut(auth).then(() => {
        alert("You have been logged out!");
        window.location.href = "login.html";
      }).catch((error) => {
        console.error("Logout failed:", error);
      });
    });
  </script>
</body>
</html>
