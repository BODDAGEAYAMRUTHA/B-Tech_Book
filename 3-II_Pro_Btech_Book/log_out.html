<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BTB Logout</title>

  <!-- Bootstrap 5.3 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <link rel="shortcut icon" href="library2.jpeg" type="image/x-icon">

  <style>
    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #6366f1, #ec4899);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, BlinkMacSystemFont;
    }

    .card {
      width: 100%;
      max-width: 420px;
      border-radius: 20px;
      border: none;
      box-shadow: 0 25px 45px rgba(0,0,0,0.25);
    }

    .btn-danger {
      border-radius: 30px;
      font-weight: 600;
      padding: 10px;
    }

    #respo {
      font-size: 14px;
      margin-top: 12px;
    }
  </style>
</head>

<body>

  <div class="card p-4 text-center">
    <h3 class="mb-3 fw-bold">Logout</h3>
    <p class="text-muted mb-4">Are you sure you want to log out?</p>

    <div class="d-grid gap-2">
      <button class="btn btn-danger" onclick="remove()">Log out</button>
      <button class="btn btn-outline-secondary" onclick="goBack()">Cancel</button>
    </div>

    <p id="respo" class="text-success"></p>
  </div>

<script>
  function remove() {
    localStorage.removeItem("user_infor");
    document.getElementById("respo").innerText = "Successfully logged out.";

    setTimeout(() => {
      window.location.href = "login.html";
    }, 1200);
  }

  function goBack() {
    window.history.back();
  }
</script>

</body>
</html>
