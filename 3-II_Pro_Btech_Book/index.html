<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BTB Register</title>

  <!-- Bootstrap 5.3 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <link rel="shortcut icon" href="library2.jpeg" type="image/x-icon">

  <style>
    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #6366f1, #ec4899);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, BlinkMacSystemFont;
    }

    .card {
      width: 100%;
      max-width: 420px;
      border-radius: 20px;
      box-shadow: 0 25px 45px rgba(0,0,0,0.25);
      border: none;
    }

    .card h3 {
      font-weight: 700;
    }

    .form-control {
      border-radius: 12px;
      padding: 12px;
    }

    .btn-primary {
      border-radius: 30px;
      padding: 10px;
      font-weight: 600;
      background: linear-gradient(90deg, #6366f1, #ec4899);
      border: none;
    }

    .btn-outline-secondary {
      border-radius: 30px;
    }

    #respo {
      font-size: 14px;
      margin-top: 10px;
    }

    .login-link {
      font-size: 14px;
    }

    .login-link a {
      text-decoration: none;
      font-weight: 600;
    }
  </style>
</head>

<body>

  <div class="card p-4">
    <h3 class="text-center mb-3">Create Account</h3>
    <p class="text-center text-muted mb-4">Register to access B-Tech Book</p>

    <div class="mb-3">
      <label class="form-label">Email</label>
      <input type="email" id="user_mail" class="form-control" placeholder="Enter email">
    </div>

    <div class="mb-3">
      <label class="form-label">Password</label>
      <input type="password" id="user_pwd" class="form-control" placeholder="Enter password">
    </div>

    <div class="d-grid gap-2">
      <button id="signupBtn" class="btn btn-primary">Register</button>
      <button id="clearBtn" class="btn btn-outline-secondary">Clear</button>
    </div>

    <p id="respo" class="text-center text-danger"></p>

    <div class="login-link text-center mt-3">
      Already have an account?
      <a href="login.html">Login</a>
    </div>
  </div>

<!-- Firebase Script (UNCHANGED) -->
<script type="module">
  import { initializeApp } from 'https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js';
  import { 
    getAuth, 
    createUserWithEmailAndPassword, 
    sendEmailVerification,
    onAuthStateChanged
  } from 'https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js';

  // Firebase config
  const firebaseConfig = {
    apiKey: "AIzaSyCPvhb-YcDLoj40-ID4n98y3p7a9DcYwFI",
    authDomain: "b-tech-book.firebaseapp.com",
    projectId: "b-tech-book",
    storageBucket: "b-tech-book.firebasestorage.app",
    messagingSenderId: "298368878481",
    appId: "1:298368878481:web:a83a4001ac7c4eb68cfc30"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const respo = document.getElementById('respo');

  document.getElementById('signupBtn').addEventListener('click', async () => {
    const email = document.getElementById('user_mail').value.trim();
    const password = document.getElementById('user_pwd').value;

    if (!email || !password) {
      respo.textContent = 'Please enter all fields.';
      return;
    }

    try {
      // Create user
      const userCredential = await createUserWithEmailAndPassword(auth, email, password);
      const user = userCredential.user;

      // Send verification email
      await sendEmailVerification(user);
      respo.textContent = 'Verification email sent! Please check your inbox and verify your account.';

      // Wait until user verifies
      const checkVerification = setInterval(async () => {
        await user.reload(); // refresh user data
        if (user.emailVerified) {
          clearInterval(checkVerification);
          respo.textContent = 'Email verified successfully! Redirecting to login...';
          setTimeout(() => {
            window.location.href = 'login.html';
          }, 1500);
        }
      }, 3000); // check every 3 seconds

    } catch (err) {
      console.error(err);
      if (err.code === 'auth/email-already-in-use') {
        respo.textContent = 'Email already registered.';
      } else if (err.code === 'auth/weak-password') {
        respo.textContent = 'Password must be at least 6 characters.';
      } else {
        respo.textContent = 'Registration failed: ' + err.message;
      }
    }
  });

  document.getElementById('clearBtn').addEventListener('click', () => {
    document.getElementById('user_mail').value = '';
    document.getElementById('user_pwd').value = '';
    respo.textContent = 'Fields cleared.';
  });
</script>

</body>
</html>
